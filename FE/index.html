<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Immediate theme initialization to eliminate reload flash (FOUC) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('quiz_theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.classList.add('preload');
          window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
              document.documentElement.classList.remove('preload');
            }, 100);
          });
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduExam Platform - Hệ Thống Thi Trắc Nghiệm Trực Tuyến</title>
    <meta name="description" content="Nền tảng thi và đánh giá năng lực trắc nghiệm trực tuyến toàn diện EduExam Platform" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
