  </defs>

  <!-- User requested squircle base -->
  <rect x="3" y="3" width="42" height="42" rx="11" fill="url(#eduShieldGrad)"></rect>
  <rect x="3" y="3" width="42" height="42" rx="11" fill="url(#eduShieldSheen)"></rect>
  <rect
